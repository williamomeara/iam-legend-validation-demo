name: iam-legend review

on:
  pull_request:
    paths:
      - 'deployment/**'
      - 'app/**'
      - '**.sh'
      - 'Makefile'
      - '.github/workflows/iam-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WIF auth so iam-legend's testIamPermissions calls answer for the
      # deployer SA (live diff). Matches the pattern in
      # https://github.com/googlecloudplatform/agent-starter-pack pr_checks.yaml.
      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/372139006998/locations/global/workloadIdentityPools/iam-legend-demo/providers/github-demo
          service_account: iam-legend-demo-deployer@tendermatch-prod.iam.gserviceaccount.com

      # No terraform plan step. The agent-starter-pack's official workflows
      # don't plan in PRs either — terraform is run out-of-band via
      # `make setup-dev-env`. iam-legend's HCL parser reads the .tf files
      # directly, so we don't need plan.json for this analysis.

      - name: iam-legend review
        uses: williamomeara/iam-legend@v0.1.1
        with:
          working-directory: deployment/terraform/dev
          project-id: tendermatch-prod
