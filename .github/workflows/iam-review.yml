name: iam-legend review

on:
  pull_request:
    paths:
      - '**.tf'
      - '**.py'
      - '**.sh'
      - 'Makefile'
      - '.github/workflows/iam-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/372139006998/locations/global/workloadIdentityPools/iam-legend-demo/providers/github-demo
          service_account: iam-legend-demo-deployer@tendermatch-prod.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: terraform plan
        working-directory: deployment/terraform/dev
        run: |
          set -e
          terraform init -backend=false -input=false
          # Plan against the dev module. -input=false means missing required vars
          # FAIL FAST instead of hanging on a prompt. The dev module's only
          # required var is dev_project_id.
          terraform plan -out=plan.tfplan -input=false \
            -var="dev_project_id=tendermatch-prod" \
            -var="project_name=iam-legend-demo" \
            || {
              echo "::warning::terraform plan failed — iam-legend will run in static HCL mode"
              exit 0
            }
          terraform show -json plan.tfplan > plan.json

      - name: iam-legend review
        uses: williamomeara/iam-legend@v0.1.0
        with:
          terraform-plan: deployment/terraform/dev/plan.json
          working-directory: .
          project-id: tendermatch-prod
